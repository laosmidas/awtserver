name: ${COMPOSE_PROJECT_NAME:-owncast}

services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    container_name: ${TAILSCALE_CONTAINER_NAME:-owncast-tailscale}
    hostname: ${TS_HOSTNAME:-owncast}
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/New_York}

      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json

      # Kernel networking is preferable for sustained video traffic.
      TS_USERSPACE: "false"

      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234

      # Optional. Leave blank unless your ACL requires a device tag.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}

    volumes:
      - ${TS_STATE_PATH:-./tailscale/state}:/var/lib/tailscale
      - ${TS_CONFIG_PATH:-./tailscale/config}:/config:ro

    devices:
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    # Preserve direct LAN access through the OMV host.
    ports:
      - "${OWNCAST_LAN_WEB_PORT:-1930}:8080/tcp"
      - "${OWNCAST_LAN_RTMP_PORT:-1935}:1935/tcp"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:41234/healthz || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  owncast:
    image: ${OWNCAST_IMAGE:-ich777/owncast:latest}
    container_name: ${OWNCAST_CONTAINER_NAME:-owncast}
    restart: unless-stopped

    # Owncast and Tailscale share the same network namespace.
    network_mode: service:tailscale

    depends_on:
      tailscale:
        condition: service_healthy

    environment:
      TZ: ${TZ:-America/New_York}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}

    volumes:
      - ${OWNCAST_DATA_PATH:-./data}:/owncast/data
      - ${OWNCAST_FFMPEG_PATH:-./ffmpeg}:/usr/local/bin/ffmpeg:ro

    runtime: nvidia